# Только для локальной разработки; на сервер не копируется и не используется.
# Порты для отладки — только на 127.0.0.1, никогда на 0.0.0.0 (SPEC 3).
services:
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_MIGRATE_ON_START: "1"

  # Пример доступа к базе с хоста для отладки (раскомментировать при необходимости):
  # db:
  #   ports:
  #     - "127.0.0.1:5432:5432"
