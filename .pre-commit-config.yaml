# Локальные хуки: версии инструментов берутся из backend/uv.lock.
# Установка (из корня репозитория): uv run --project backend pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run --directory backend ruff format --check .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run --directory backend bandit -c pyproject.toml -r . -q
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
